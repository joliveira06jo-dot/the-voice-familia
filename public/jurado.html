<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Voice Família - Módulo Jurado</title>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#951573">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Voice Jurado">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0b0218 url('/fundo-palco.png') no-repeat center center fixed; background-size: cover; color: #000000; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }

        .top-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 380px; margin-bottom: 15px; padding: 0 5px; }
        .header-logo { height: 110px; max-width: 190px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8)); }
        
        .header-title-box { display: flex; flex-direction: column; align-items: flex-end; }
        .title-modulo { color: #ffffff; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); line-height: 1; }
        .badge-jurado { background: #951573; color: #ffffff; padding: 4px 16px; border-radius: 12px; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; margin-top: 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.4); line-height: 1; }

        .card-white { width: 100%; max-width: 380px; background: #ffffff; border-radius: 25px; padding: 22px 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }

        .ola-jurado { color: #951573; font-size: 1.15rem; font-weight: 900; text-transform: uppercase; margin-bottom: 16px; letter-spacing: 0.5px; }

        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; font-weight: 900; margin-bottom: 8px; color: #000000; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 12px; border-radius: 14px; border: 2px solid #000000; background: #ffffff; color: #000000; font-size: 1rem; font-weight: 900; text-align: center; outline: none; text-transform: uppercase; }

        .btn-magenta { width: 100%; background: #951573; color: #ffffff; border: none; padding: 15px; border-radius: 14px; font-weight: 900; font-size: 1.1rem; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(149, 21, 115, 0.4); margin-top: 10px; }

        .jurados-footer { margin-top: 18px; }
        .jurados-label { font-size: 0.85rem; font-weight: 900; text-transform: uppercase; color: #000000; margin-bottom: 8px; letter-spacing: 0.5px; }
        .jurados-icons { display: flex; justify-content: center; gap: 8px; }
        .user-icon { width: 38px; height: 38px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }

        .radar-box { width: 130px; height: 130px; margin: 10px auto 12px auto; position: relative; }
        .radar-svg { width: 100%; height: 100%; }
        .radar-sweep { transform-origin: 50px 50px; animation: spinRadar 2.2s linear infinite; }
        @keyframes spinRadar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .ag-static-title { color: #951573; font-size: 1.25rem; font-weight: 900; text-transform: uppercase; line-height: 1; }

        .ag-anim-container { position: relative; height: 55px; overflow: hidden; margin-top: 4px; }
        .ag-anim-item { position: absolute; width: 100%; left: 0; top: 0; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease; opacity: 0; transform: translateY(-25px); }
        .ag-anim-item.active { opacity: 1; transform: translateY(0); }
        .ag-anim-item.exit { opacity: 0; transform: translateY(25px); }

        .txt-dynam-title { color: #951573; font-size: 1.15rem; font-weight: 900; text-transform: uppercase; line-height: 1.2; }
        .txt-dynam-sub { color: #555555; font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

        .alert-svg { width: 120px; height: 120px; margin: 10px auto 15px auto; display: block; }
        .txt-alert-title { color: #951573; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; line-height: 1.3; margin-bottom: 8px; }
        .txt-alert-sub { color: #555555; font-size: 0.72rem; font-weight: 900; text-transform: uppercase; line-height: 1.3; }

        .pill-iniciada { background: #951573; color: #ffffff; font-size: 1.05rem; font-weight: 900; padding: 10px; border-radius: 12px; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .txt-instrucao { color: #951573; font-size: 0.95rem; font-weight: 900; text-transform: uppercase; line-height: 1.3; margin-bottom: 8px; }
        .txt-atencao { color: #666666; font-size: 0.65rem; font-weight: 800; margin-bottom: 14px; }

        .preview-chairs-box { background: #e0e0e0; border-radius: 20px; padding: 16px 10px; display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 18px; min-height: 150px; }
        .chair-small { width: 55px; height: 70px; object-fit: contain; filter: opacity(0.85); }
        .arrow-grey { font-size: 2.2rem; color: #888888; font-weight: 900; line-height: 1; }
        .chair-large { width: 110px; height: 135px; object-fit: contain; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35)); }

        .btn-virar-cadeira { position: relative; overflow: hidden; width: 100%; background: linear-gradient(135deg, #951573 0%, #b81b8f 50%, #951573 100%); color: #ffffff; border: none; padding: 18px 20px; border-radius: 16px; font-weight: 900; font-size: 1.25rem; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 6px 22px rgba(149, 21, 115, 0.6); animation: pulseZoom 4s infinite ease-in-out; transition: transform 0.1s; }
        .btn-virar-cadeira:active { transform: scale(0.97); }
        @keyframes pulseZoom { 0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(149, 21, 115, 0.6); } 50% { transform: scale(1.03); box-shadow: 0 10px 28px rgba(229, 9, 20, 0.8); } }
        .btn-virar-cadeira::after { content: ''; position: absolute; top: -50%; left: -60%; width: 50%; height: 200%; background: rgba(255, 255, 255, 0.35); transform: rotate(25deg); animation: sheen 5s infinite; }
        @keyframes sheen { 0% { left: -60%; } 20% { left: 140%; } 100% { left: 140%; } }

        .circle-icon { background: #ffffff; color: #951573; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 900; z-index: 2; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        .btn-text { z-index: 2; letter-spacing: 0.5px; }

        .pill-encerrada { background: #3c3c3c; color: #ffffff; font-size: 1.05rem; font-weight: 900; padding: 10px; border-radius: 12px; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .txt-encerrada { color: #3c3c3c; font-size: 0.95rem; font-weight: 900; text-transform: uppercase; line-height: 1.3; margin-bottom: 14px; }

        .result-box { border-radius: 20px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; }
        .result-box.magenta { background: #e0e0e0; border: 3px solid #951573; box-shadow: 0 4px 15px rgba(149, 21, 115, 0.3); }
        .result-box.grey { background: #b5b5b5; border: 3px solid #4a4a4a; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); }
        .result-chair-img { width: 125px; height: 150px; object-fit: contain; margin-bottom: 12px; filter: drop-shadow(0 6px 10px rgba(0,0,0,0.3)); }
        .result-banner { width: 100%; padding: 13px; border-radius: 12px; font-weight: 900; font-size: 1.05rem; text-transform: uppercase; color: #ffffff; letter-spacing: 0.5px; }
        .result-banner.magenta { background: #951573; box-shadow: 0 3px 8px rgba(149, 21, 115, 0.4); }
        .result-banner.grey { background: #4a4a4a; box-shadow: 0 3px 8px rgba(0,0,0,0.3); }

        /* === BANNER INSTALAR CHAMATIVO === */
        @keyframes flashYellow {
            0%, 100% { box-shadow: 0 4px 20px rgba(149, 21, 115, 0.5); transform: scale(1); }
            25%, 75% { box-shadow: 0 0 40px 12px rgba(251, 191, 36, 1); transform: scale(1.02); }
            50% { box-shadow: 0 4px 20px rgba(149, 21, 115, 0.5); transform: scale(1); }
        }
        @keyframes pulseYellowGlow {
            0%, 100% { box-shadow: 0 4px 20px rgba(149, 21, 115, 0.5); }
            50% { box-shadow: 0 0 25px 6px rgba(251, 191, 36, 0.6); }
        }
        @keyframes bounceDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .banner-instalar {
            width: 100%;
            max-width: 380px;
            margin-bottom: 12px;
            padding: 12px;
            background: linear-gradient(135deg, #951573 0%, #6b0f52 100%);
            border: 2px solid #FBBF24;
            border-radius: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: flashYellow 1.6s ease-in-out 1, pulseYellowGlow 2.5s ease-in-out 1.6s infinite;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .banner-instalar.hidden { display: none; }
        .banner-icon-box {
            background: #FBBF24;
            border-radius: 10px;
            padding: 8px;
            flex-shrink: 0;
            animation: bounceDown 1.5s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner-icon-box svg { width: 20px; height: 20px; color: #000; }
        .banner-text-box { flex: 1; min-width: 0; text-align: left; }
        .banner-title { color: #fff; font-size: 0.78rem; font-weight: 900; line-height: 1.1; text-transform: uppercase; }
        .banner-subtitle { color: rgba(255,255,255,0.9); font-size: 0.65rem; font-weight: 700; line-height: 1.1; margin-top: 2px; }
        .banner-btn {
            background: #FBBF24;
            color: #000;
            border: none;
            font-weight: 900;
            font-size: 0.7rem;
            padding: 8px 12px;
            border-radius: 999px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            transition: transform 0.1s;
            text-transform: uppercase;
        }
        .banner-btn:active { transform: scale(0.95); }
        .banner-close {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            flex-shrink: 0;
            padding: 0 4px;
            line-height: 1;
        }
        .banner-close:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="top-header">
        <img src="/logo-thevoice.png" alt="The Voice Família" class="header-logo">
        <div class="header-title-box">
            <div class="title-modulo">MÓDULO</div>
            <div class="badge-jurado">JURADO</div>
        </div>
    </div>

    <!-- BANNER INSTALAR CHAMATIVO -->
    <div id="bannerInstalar" class="banner-instalar hidden">
        <div class="banner-icon-box">
            <svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
        </div>
        <div class="banner-text-box">
            <p class="banner-title">📲 INSTALE O APP</p>
            <p class="banner-subtitle">Melhor experiência na votação!</p>
        </div>
        <button class="banner-btn" id="btnInstalarBanner">INSTALAR</button>
        <button class="banner-close" id="btnFecharBanner">×</button>
    </div>

    <div class="card-white">

        <div id="screenLogin">
            <div class="form-group">
                <label>INSIRA O SEU NOME</label>
                <input type="text" id="inputNome" maxlength="10" placeholder="Ex: Felipe">
            </div>
            <button class="btn-magenta" onclick="entrar()">ENTRAR COMO JURADO ❯❯</button>
            
            <div class="jurados-footer">
                <div class="jurados-label">JURADOS ONLINE</div>
                <div class="jurados-icons" id="iconsLogin"></div>
            </div>
        </div>

        <div id="screenPainel" style="display:none;">
            <div class="ola-jurado" id="txtOla">OLÁ, JURADO</div>
            <div id="boxConteudo"></div>
            <div class="jurados-footer">
                <div class="jurados-label">JURADOS ONLINE</div>
                <div class="jurados-icons" id="iconsPainel"></div>
            </div>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ===== PWA: Service Worker + Banner de Instalação =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch((err) => { console.log('[PWA] SW não registrado:', err); });
            });
        }

        let deferredPrompt = null;
        const bannerInstalar = document.getElementById('bannerInstalar');
        const btnInstalarBanner = document.getElementById('btnInstalarBanner');
        const btnFecharBanner = document.getElementById('btnFecharBanner');

        const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const dismissed = sessionStorage.getItem('pwa_banner_voice_dismissed');
            if (!dismissed && !isStandalone()) {
                setTimeout(() => { bannerInstalar.classList.remove('hidden'); }, 2000);
            }
        });

        window.addEventListener('appinstalled', () => {
            bannerInstalar.classList.add('hidden');
            deferredPrompt = null;
        });

        // iOS: mostra banner especial
        setTimeout(() => {
            if (isIOS() && !isStandalone() && !sessionStorage.getItem('pwa_banner_voice_dismissed')) {
                bannerInstalar.classList.remove('hidden');
            }
        }, 2000);

        btnInstalarBanner.addEventListener('click', async () => {
            if (isIOS()) {
                alert('Para instalar: toque em ⬆️ Compartilhar e depois "Adicionar à Tela de Início".');
                return;
            }
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            bannerInstalar.classList.add('hidden');
            if (outcome === 'dismissed') sessionStorage.setItem('pwa_banner_voice_dismissed', '1');
            deferredPrompt = null;
        });

        btnFecharBanner.addEventListener('click', () => {
            bannerInstalar.classList.add('hidden');
            sessionStorage.setItem('pwa_banner_voice_dismissed', '1');
        });

        // ===== Lógica original do app =====
        const socket = io();
        let meuNome = '';
        let estado = {};
        let textAnimationInterval = null;

        document.getElementById('inputNome').addEventListener('input', function(e) {
            this.value = this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '');
        });

        function getUserSvg(ativo) {
            const cor = ativo ? "#00cc55" : "#777777";
            return `<svg class="user-icon" viewBox="0 0 24 24" fill="${cor}"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
        }

        socket.on('updateState', (state) => {
            estado = state;
            atualizarInterface();
        });

        function entrar() {
            const rawNome = document.getElementById('inputNome').value;
            const nomeClean = rawNome.replace(/[^a-zA-ZÀ-ÿ\s]/g, '').trim().substring(0, 10);
            
            if(!nomeClean) return alert('Por favor, insira o seu nome (apenas letras, máximo 10 caracteres)!');
            
            const total = Object.keys(estado.jurados || {}).length;
            if(total >= 6) {
                mostrarVagasLotadas();
                return;
            }

            meuNome = nomeClean;
            socket.emit('registrarJurado', meuNome);

            document.getElementById('screenLogin').style.display = 'none';
            document.getElementById('screenPainel').style.display = 'block';
            document.getElementById('txtOla').innerText = `OLÁ, ${meuNome.toUpperCase()}`;
            atualizarInterface();
        }

        function iniciarAnimacaoTexto() {
            if (textAnimationInterval) clearInterval(textAnimationInterval);
            let idx = 0;
            textAnimationInterval = setInterval(() => {
                const el1 = document.getElementById('jurAgTxt1');
                const el2 = document.getElementById('jurAgTxt2');
                if (!el1 || !el2) return;

                if (idx === 0) {
                    el1.className = 'ag-anim-item exit';
                    el2.className = 'ag-anim-item active';
                    idx = 1;
                } else {
                    el2.className = 'ag-anim-item exit';
                    el1.className = 'ag-anim-item active';
                    idx = 0;
                }
            }, 4000);
        }

        function atualizarInterface() {
            const total = Object.keys(estado.jurados || {}).length;

            let iconsHtml = '';
            for(let i=0; i<6; i++) iconsHtml += getUserSvg(i < total);
            document.getElementById('iconsLogin').innerHTML = iconsHtml;
            document.getElementById('iconsPainel').innerHTML = iconsHtml;

            if(!meuNome) return;

            const box = document.getElementById('boxConteudo');
            const status = estado.status;
            const meuSocket = socket.id;
            const meuDado = estado.jurados[meuSocket];
            const jaVirei = meuDado ? meuDado.virou : false;

            if (status === 'aguardando') {
                box.innerHTML = `
                    <div class="radar-box">
                        <svg class="radar-svg" viewBox="0 0 100 100">
                            <circle cx="50" cy="50" r="46" fill="none" stroke="#b0b0b0" stroke-width="4"/>
                            <circle cx="50" cy="50" r="45" fill="#951573"/>
                            <circle cx="50" cy="50" r="32" fill="none" stroke="#ffffff" stroke-width="2"/>
                            <circle cx="50" cy="50" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
                            <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
                            <line x1="50" y1="5" x2="50" y2="95" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
                            <circle cx="68" cy="32" r="3" fill="#ffffff"/>
                            <circle cx="35" cy="65" r="2.5" fill="#ffffff"/>
                            <g class="radar-sweep">
                                <path d="M 50 50 L 50 5 A 45 45 0 0 1 85 20 Z" fill="rgba(255, 255, 255, 0.45)"/>
                            </g>
                        </svg>
                    </div>
                    <div class="ag-static-title">AGUARDANDO</div>
                    <div class="ag-anim-container">
                        <div id="jurAgTxt1" class="ag-anim-item active">
                            <div class="txt-dynam-title">OUTROS JURADOS</div>
                            <div class="txt-dynam-sub">É NECESSÁRIO NO MÍNIMO DOIS JURADOS</div>
                        </div>
                        <div id="jurAgTxt2" class="ag-anim-item">
                            <div class="txt-dynam-title">PRÓXIMA MÚSICA</div>
                            <div class="txt-dynam-sub">O PRÓXIMO CANTOR ESTÁ AQUECENDO O GOGÓ</div>
                        </div>
                    </div>
                `;
                iniciarAnimacaoTexto();
            } else {
                if (textAnimationInterval) clearInterval(textAnimationInterval);

                if (status === 'rodando') {
                    if(jaVirei) {
                        box.innerHTML = `
                            <div class="pill-iniciada">RODADA INICIADA</div>
                            <div class="txt-instrucao" style="margin-top:10px; margin-bottom:12px;">VOCÊ VIROU A CADEIRA!</div>
                            <div class="result-box magenta">
                                <img class="result-chair-img" src="/cadeira-colorida.png" alt="Cadeira Acesa">
                                <div class="result-banner magenta">VIROU A CADEIRA</div>
                            </div>
                        `;
                    } else {
                        box.innerHTML = `
                            <div class="pill-iniciada">RODADA INICIADA</div>
                            <div class="txt-instrucao">AVALIE O CANTOR E, SE DESEJAR, CLIQUE ABAIXO PARA VIRAR A CADEIRA</div>
                            <div class="txt-atencao">Atenção: Não é possível "desvirar" a cadeira depois.</div>
                            
                            <div class="preview-chairs-box">
                                <img class="chair-small" src="/cadeira-pb.png" alt="Cadeira Desligada">
                                <span class="arrow-grey">➔</span>
                                <img class="chair-large" src="/cadeira-colorida.png" alt="Cadeira Acesa">
                            </div>

                            <button class="btn-virar-cadeira" onclick="virar()">
                                <span class="circle-icon">❯</span>
                                <span class="btn-text">VIRAR A CADEIRA</span>
                                <span class="circle-icon">❯</span>
                            </button>
                        `;
                    }
                } else if (status === 'votacao_encerrada' || status === 'resultado') {
                    if(jaVirei) {
                        box.innerHTML = `
                            <div class="pill-iniciada">VOTAÇÃO ENCERRADA</div>
                            <div class="txt-instrucao" style="margin-top:10px; margin-bottom:12px;">VOCÊ VIROU A CADEIRA!</div>
                            <div class="result-box magenta">
                                <img class="result-chair-img" src="/cadeira-colorida.png" alt="Cadeira Acesa">
                                <div class="result-banner magenta">VIROU A CADEIRA</div>
                            </div>
                        `;
                    } else {
                        box.innerHTML = `
                            <div class="pill-encerrada">RODADA ENCERRADA</div>
                            <div class="txt-encerrada">O TEMPO ACABOU E VOCÊ NÃO VIROU A CADEIRA!</div>
                            <div class="result-box grey">
                                <img class="result-chair-img" src="/cadeira-pb.png" alt="Cadeira Desligada">
                                <div class="result-banner grey">NÃO VIROU A CADEIRA</div>
                            </div>
                        `;
                    }
                }
            }
        }

        function mostrarVagasLotadas() {
            document.getElementById('screenLogin').style.display = 'none';
            document.getElementById('screenPainel').style.display = 'block';
            document.getElementById('boxConteudo').innerHTML = `
                <svg class="alert-svg" viewBox="0 0 100 100">
                    <polygon points="50,8 92,88 8,88" fill="none" stroke="#951573" stroke-width="7" stroke-linejoin="round"/>
                    <text x="50" y="73" fill="#951573" font-size="48" font-weight="900" text-anchor="middle">!</text>
                </svg>
