<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Voice Família - Módulo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0b0218 url('https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=1000') no-repeat center center fixed; background-size: cover; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: rgba(15, 5, 25, 0.9); border: 2px solid #e50914; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); }
        h1 { text-align: center; color: #ffcc00; font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 5px; color: #ff88cc; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #fff; color: #000; font-size: 1rem; font-weight: 700; outline: none; }
        .jurados-status { text-align: center; margin: 20px 0; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; }
        .jurados-icons { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
        .dot { width: 15px; height: 15px; border-radius: 50%; background: #666; display: inline-block; }
        .dot.active { background: #00ff66; box-shadow: 0 0 10px #00ff66; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-iniciar { background: #00cc44; color: #fff; }
        .btn-iniciar:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-finalizar { background: #e50914; color: #fff; margin-top: 10px; }
        .historico-box { margin-top: 30px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; max-height: 250px; overflow-y: auto; }
        .historico-box h3 { font-size: 1rem; margin-bottom: 10px; color: #ffcc00; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .historico-item { font-size: 0.8rem; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 5px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Módulo Admin</h1>
        
        <div class="form-group">
            <label>Nome do(s) Cantor(es)</label>
            <input type="text" id="inputCantor" placeholder="Ex: João e Maria">
        </div>
        <div class="form-group">
            <label>Artista / Banda</label>
            <input type="text" id="inputArtista" placeholder="Ex: Marília Mendonça">
        </div>
        <div class="form-group">
            <label>Nome da Música</label>
            <input type="text" id="inputMusica" placeholder="Ex: Infiel">
        </div>

        <div class="jurados-status">
            <p id="txtStatusJurados">Aguardando Jurados (Mínimo 2)</p>
            <div class="jurados-icons" id="iconsJurados"></div>
        </div>

        <button id="btnAcao" class="btn-iniciar" disabled onclick="controlarRodada()">Aguardando Mínimo de Jurados</button>
        <button id="btnFinalizar" class="btn-finalizar" style="display:none;" onclick="finalizarRodada()">Finalizar Rodada Atual</button>

        <div class="historico-box">
            <h3>Últimas Rodadas</h3>
            <div id="listaHistorico">Nenhuma rodada realizada ainda.</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let estadoAtual = {};

        socket.on('updateState', (state) => {
            estadoAtual = state;
            atualizarTela();
        });

        function atualizarTela() {
            const juradosIds = Object.keys(estadoAtual.jurados);
            const qtdJurados = juradosIds.length;
            
            // Renderiza bolinhas de status dos jurados online
            let iconsHtml = '';
            for(let i=0; i<6; i++) {
                if(i < qtdJurados) {
                    iconsHtml += `<span class="dot active" title="${estadoAtual.jurados[juradosIds[i]].nome}"></span>`;
                } else {
                    iconsHtml += `<span class="dot"></span>`;
                }
            }
            document.getElementById('iconsJurados').innerHTML = iconsHtml;

            const btn = document.getElementById('btnAcao');
            const btnFim = document.getElementById('btnFinalizar');

            if (estadoAtual.status === 'aguardando') {
                if (qtdJurados >= 2) {
                    document.getElementById('txtStatusJurados').innerText = `Pronto! ${qtdJurados} jurados conectados.`;
                    btn.disabled = false;
                    btn.innerText = "Iniciar Rodada";
                    btn.className = "btn-iniciar";
                } else {
                    document.getElementById('txtStatusJurados').innerText = `Aguardando Jurados (${qtdJurados}/2 mínimo)`;
                    btn.disabled = true;
                    btn.innerText = "Mínimo de 2 Jurados Necessário";
                    btn.className = "btn-iniciar";
                }
                btnFim.style.display = 'none';
            } else if (estadoAtual.status === 'rodando') {
                document.getElementById('txtStatusJurados').innerText = "Rodada em Andamento!";
                btn.style.display = 'none';
                btnFim.style.display = 'block';
            }

            // Histórico
            if (estadoAtual.historico.length > 0) {
                let histHtml = '';
                estadoAtual.historico.forEach(h => {
                    histHtml += `<div class="historico-item">
                        <strong>${h.cantor}</strong> cantou ${h.musica} (${h.artista})<br>
                        <small>Horário: ${h.dataHora}</small>
                    </div>`;
                });
                document.getElementById('listaHistorico').innerHTML = histHtml;
            }
        }

        function controlarRodada() {
            const cantor = document.getElementById('inputCantor').value || 'Cantor(a)';
            const artista = document.getElementById('inputArtista').value || 'Artista';
            const musica = document.getElementById('inputMusica').value || 'Música';

            socket.emit('iniciarRodada', { cantor, artista, musica });
        }

        function finalizarRodada() {
            socket.emit('finalizarRodada');
            document.getElementById('btnFinalizar').style.display = 'none';
            document.getElementById('btnAcao').style.display = 'block';
        }
    </script>
</body>
</html>
