<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Voice Família - Módulo Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
        body { background: #0b0218 url('/fundo-palco.png') no-repeat center center fixed; background-size: cover; color: #ffffff; min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }

        /* Cabeçalho Topo */
        .top-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-bottom: 12px; }
        .header-logo { height: 46px; object-fit: contain; }
        .header-title { color: #ffffff; font-size: 1.15rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .badge-admin { background: #951573; color: #ffffff; padding: 3px 10px; border-radius: 8px; font-size: 1.05rem; font-weight: 900; }

        /* Card Principal */
        .main-card { width: 100%; max-width: 400px; background: rgba(10, 2, 20, 0.88); border: 2px solid #800db0; border-radius: 22px; padding: 20px 18px; box-shadow: 0 0 25px rgba(128, 13, 176, 0.4); backdrop-filter: blur(4px); }

        /* Formulário de Início */
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.75rem; font-weight: 900; margin-bottom: 5px; color: #ffffff; text-transform: uppercase; text-align: center; letter-spacing: 0.5px; }
        input { width: 100%; padding: 11px; border-radius: 12px; border: 2px solid #ffffff; background: #ffffff; color: #000000; font-size: 0.95rem; font-weight: 900; text-align: center; outline: none; }

        .jurados-box { text-align: center; margin: 15px 0 10px 0; }
        .jurados-label { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: #ffffff; margin-bottom: 6px; letter-spacing: 0.5px; }
        .jurados-icons { display: flex; justify-content: center; gap: 6px; }
        .user-icon { width: 22px; height: 22px; }

        .btn-iniciar { width: 100%; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 1.05rem; text-transform: uppercase; border: none; transition: 0.2s; margin-top: 10px; }
        .btn-iniciar:disabled { background: #333333; color: #777777; cursor: not-allowed; border: 2px solid #444444; }
        .btn-iniciar.active { background: #4c2882; color: #ffffff; border: 2px solid #800db0; cursor: pointer; box-shadow: 0 4px 12px rgba(128, 13, 176, 0.5); }

        /* Card Rodada em Andamento (Idêntico ao Protótipo) */
        .andamento-box { border: 2px solid #ffffff; border-radius: 20px; padding: 18px 12px; text-align: center; background: rgba(15, 2, 25, 0.6); box-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .andamento-title { color: #ffffff; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; margin-bottom: 18px; letter-spacing: 0.5px; }

        .timer-container { position: relative; width: 130px; height: 130px; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; }
        .timer-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        .timer-text { position: relative; z-index: 2; color: #951573; font-size: 1rem; font-weight: 900; text-transform: uppercase; margin-top: 8px; }

        .buttons-stack { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .btn-encerrar-votacao { width: 100%; background: #4c2882; color: #ffffff; border: 2px solid #800db0; padding: 13px; border-radius: 12px; font-weight: 900; font-size: 1rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-finalizar-rodada { width: 100%; background: #ffffff; color: #951573; border: 2px solid #951573; padding: 13px; border-radius: 12px; font-weight: 900; font-size: 1rem; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }

        /* Histórico de Rodadas (Abaixo da Tela) */
        .historico-container { width: 100%; max-width: 400px; margin-top: 15px; background: #e0e0e0; border-radius: 20px; padding: 14px; color: #000000; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .historico-title { text-align: center; font-size: 0.95rem; font-weight: 900; text-transform: uppercase; margin-bottom: 10px; color: #000000; }

        .hist-card { background: #ffffff; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .hist-details { font-size: 0.72rem; font-weight: 900; color: #000000; line-height: 1.35; text-transform: uppercase; }
        .hist-details span { font-weight: 700; color: #333333; }
        .hist-jurados-icons { display: flex; gap: 3px; align-items: center; }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <div class="top-header">
        <img src="/logo-thevoice.png" alt="The Voice Família" class="header-logo">
        <div class="header-title">MÓDULO <span class="badge-admin">ADMIN</span></div>
    </div>

    <!-- Container Principal -->
    <div class="main-card">
        
        <!-- Estado 1: Formulário de Pré-Rodada -->
        <div id="viewForm">
            <div class="form-group">
                <label>NOME DO(S) CANTOR(ES)</label>
                <input type="text" id="inputCantor">
            </div>
            <div class="form-group">
                <label>ARTISTA</label>
                <input type="text" id="inputArtista">
            </div>
            <div class="form-group">
                <label>NOME DA MÚSICA</label>
                <input type="text" id="inputMusica">
            </div>

            <div class="jurados-box">
                <div class="jurados-label">JURADOS ONLINE</div>
                <div class="jurados-icons" id="iconsForm"></div>
            </div>

            <button id="btnIniciar" class="btn-iniciar" disabled onclick="iniciarRodada()">INICIAR RODADA</button>
        </div>

        <!-- Estado 2: Rodada em Andamento -->
        <div id="viewAndamento" style="display:none;">
            <div class="andamento-box">
                <div class="andamento-title">RODADA EM ANDAMENTO</div>
                
                <div class="timer-container">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <path d="M 30,12 L 20,5 M 70,12 L 80,5 M 40,5 L 60,5" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="50" cy="55" r="38" fill="none" stroke="#ffffff" stroke-width="4"/>
                        <circle cx="50" cy="55" r="28" fill="#ffffff"/>
                    </svg>
                    <div class="timer-text">AGUARDE</div>
                </div>

                <div class="jurados-box">
                    <div class="jurados-label">JURADOS ONLINE</div>
                    <div class="jurados-icons" id="iconsAndamento"></div>
                </div>

                <div class="buttons-stack">
                    <button class="btn-encerrar-votacao" onclick="encerrarVotacao()">ENCERRAR VOTAÇÃO</button>
                    <button class="btn-finalizar-rodada" onclick="finalizarRodada()">FINALIZAR RODADA</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Bloco de Últimas Rodadas -->
    <div class="historico-container">
        <div class="historico-title">ÚLTIMAS RODADAS</div>
        <div id="listaHistorico">
            <div style="text-align:center; font-size:0.75rem; font-weight:700; color:#666;">Nenhuma rodada realizada ainda.</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let estado = {};

        function getUserSvg(ativo) {
            const cor = ativo ? "#00cc55" : "#666666";
            return `<svg class="user-icon" viewBox="0 0 24 24" fill="${cor}"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
        }

        socket.on('updateState', (state) => {
            estado = state;
            const juradosIds = Object.keys(state.jurados || {});
            const total = juradosIds.length;

            let iconsHtml = '';
            for(let i=0; i<6; i++) {
                iconsHtml += getUserSvg(i < total);
            }
            document.getElementById('iconsForm').innerHTML = iconsHtml;
            document.getElementById('iconsAndamento').innerHTML = iconsHtml;

            const viewForm = document.getElementById('viewForm');
            const viewAndamento = document.getElementById('viewAndamento');
            const btnIniciar = document.getElementById('btnIniciar');

            if (state.status === 'aguardando') {
                viewForm.style.display = 'block';
                viewAndamento.style.display = 'none';

                if (total >= 2) {
                    btnIniciar.disabled = false;
                    btnIniciar.classList.add('active');
                } else {
                    btnIniciar.disabled = true;
                    btnIniciar.classList.remove('active');
                }
            } else if (state.status === 'rodando' || state.status === 'votacao_encerrada') {
                viewForm.style.display = 'none';
                viewAndamento.style.display = 'block';
            }

            if (state.historico && state.historico.length > 0) {
                let hHtml = '';
                state.historico.forEach(h => {
                    let iconsList = '';
                    if (h.juradosDetalhados) {
                        h.juradosDetalhados.forEach(j => {
                            iconsList += getUserSvg(j.virou);
                        });
                    }
                    hHtml += `
                        <div class="hist-card">
                            <div class="hist-details">
                                NOME DO(S) CANTOR(ES): <span>${h.cantor}</span><br>
                                ARTISTA: <span>${h.artista}</span><br>
                                MÚSICA: <span>${h.musica}</span><br>
                                <span style="font-size:0.65rem; color:#888888;">${h.dataHora}</span>
                            </div>
                            <div class="hist-jurados-icons">${iconsList}</div>
                        </div>
                    `;
                });
                document.getElementById('listaHistorico').innerHTML = hHtml;
            }
        });

        function iniciarRodada() {
            const cantor = document.getElementById('inputCantor').value || 'Cantor';
            const artista = document.getElementById('inputArtista').value || 'Artista';
            const musica = document.getElementById('inputMusica').value || 'Música';
            socket.emit('iniciarRodada', { cantor, artista, musica });
        }

        function encerrarVotacao() {
            socket.emit('encerrarVotacao');
        }

        function finalizarRodada() {
            document.getElementById('inputCantor').value = '';
            document.getElementById('inputArtista').value = '';
            document.getElementById('inputMusica').value = '';
            socket.emit('finalizarRodada');
        }
    </script>
</body>
</html>
